<svg width="400" height="500" viewBox="0 0 400 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="500" rx="16" fill="#101216"/>
  <!-- Subtle engineering grid -->
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="500" fill="url(#grid)"/>
  <circle cx="200" cy="200" r="160" fill="url(#glow)"/>
  
  <!-- Stylized Engineer Wireframe Silhouette -->
  <circle cx="200" cy="170" r="56" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2" stroke-dasharray="4 4" fill="rgba(16, 185, 129, 0.06)"/>
  <circle cx="200" cy="170" r="42" stroke="#10B981" stroke-width="2" fill="rgba(16, 185, 129, 0.12)"/>
  <path d="M 120 310 C 120 250, 160 240, 200 240 C 240 240, 280 250, 280 310" stroke="#10B981" stroke-width="2" fill="rgba(16, 185, 129, 0.08)"/>
  <path d="M 90 380 C 90 320, 140 310, 200 310 C 260 310, 310 320, 310 380" stroke="rgba(255, 255, 255, 0.18)" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Telemetry HUD Accents -->
  <path d="M 24 24 L 24 48 M 24 24 L 48 24" stroke="#10B981" stroke-width="2"/>
  <path d="M 376 24 L 376 48 M 376 24 L 352 24" stroke="#10B981" stroke-width="2"/>
  <path d="M 24 476 L 24 452 M 24 476 L 48 476" stroke="#10B981" stroke-width="2"/>
  <path d="M 376 476 L 376 452 M 376 476 L 352 476" stroke="#10B981" stroke-width="2"/>

  <!-- Telemetry Data Overlay -->
  <text x="36" y="52" font-family="JetBrains Mono, monospace" font-size="11" fill="#10B981" font-weight="600" letter-spacing="1">PHYSICAL AI // RESEARCHER</text>
  <text x="36" y="70" font-family="JetBrains Mono, monospace" font-size="10" fill="#9CA3AF">ID: PK-01 // ISAAC LAB &amp; VLA</text>
  <text x="200" y="440" font-family="Inter, sans-serif" font-size="14" fill="#FFFFFF" font-weight="600" text-anchor="middle">Piyas Ahmed Kheyal</text>
  <text x="200" y="460" font-family="JetBrains Mono, monospace" font-size="10" fill="#10B981" text-anchor="middle">Drop your photo at public/images/profile.jpg</text>
</svg>
